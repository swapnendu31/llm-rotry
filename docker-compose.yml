version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: llm_rotry_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    container_name: llm_rotry_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DB_PATH=/app/keys.db
    volumes:
      - ./keys.db:/app/keys.db
    depends_on:
      - redis

volumes:
  redis_data:
